name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The default GITHUB_TOKEN is scoped to this repo only and can't
          # push to the tap/bucket repos, so each of those repos has its own
          # write deploy key; the private half lives in these secrets and
          # GoReleaser pushes over SSH with it (default ssh_command adds
          # -o StrictHostKeyChecking=accept-new, so no known_hosts setup
          # step is needed here).
          # https://github.com/goreleaser/goreleaser/blob/main/www/content/customization/publish/homebrew_casks.md
          HOMEBREW_TAP_SSH_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
          SCOOP_BUCKET_SSH_KEY: ${{ secrets.SCOOP_BUCKET_SSH_KEY }}
